<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <title>Test CSSStyleSheet constructor</title>
  <script type="application/javascript" src="/tests/SimpleTest/SimpleTest.js"></script>
  <link rel="stylesheet" type="text/css" href="/tests/SimpleTest/test.css">
</head>
<body>
<pre id="test"></pre>
<div id="adopted-target"></div>
<div id="shadow-host"></div>
<script type="application/javascript">
"use strict";

SimpleTest.waitForExplicitFinish();

let sheet;

try {
  sheet = new CSSStyleSheet();
  ok(true, "CSSStyleSheet constructor should not throw");
} catch (e) {
  ok(false, "CSSStyleSheet constructor should not throw: " + e);
}

if (sheet) {
  ok(sheet instanceof CSSStyleSheet, "Constructor should create a CSSStyleSheet");
  is(sheet.type, "text/css", "Constructed sheet should have CSS type");
  is(sheet.href, null, "Constructed sheet should not have an href");
  is(sheet.cssRules.length, 0, "Constructed sheet should start with no rules");

  is(sheet.insertRule("#test { color: rgb(1, 2, 3); }", 0), 0,
     "insertRule should work on a constructed sheet");
  is(sheet.cssRules.length, 1, "insertRule should append a rule");
  is(sheet.cssRules[0].selectorText, "#test", "Inserted rule should be readable");

  sheet.deleteRule(0);
  is(sheet.cssRules.length, 0, "deleteRule should remove the rule");

  is(sheet.replaceSync("#test { color: rgb(4, 5, 6); } p { margin-top: 1px; }"),
     undefined, "replaceSync should return undefined");
  is(sheet.cssRules.length, 2, "replaceSync should replace with parsed rules");
  is(sheet.cssRules[0].selectorText, "#test",
     "replaceSync should expose the first parsed rule");
  is(sheet.cssRules[1].selectorText, "p",
     "replaceSync should expose subsequent parsed rules");

  sheet.replaceSync("@import url('neverending_stylesheet_load.sjs'); #test { color: rgb(7, 8, 9); }");
  is(sheet.cssRules.length, 1, "replaceSync should remove @import rules");
  is(sheet.cssRules[0].selectorText, "#test",
     "replaceSync should keep non-import rules after removed imports");

  sheet.replaceSync("}");
  is(sheet.cssRules.length, 0,
     "replaceSync should replace with an empty rule list when nothing parses");

  try {
    document.styleSheets[0].replaceSync("#test { color: rgb(10, 11, 12); }");
    ok(false, "replaceSync should throw for non-constructed sheets");
  } catch (e) {
    is(e.name, "NotAllowedError",
       "replaceSync should reject non-constructed sheets with NotAllowedError");
  }

  try {
    sheet.insertRule("@import url('neverending_stylesheet_load.sjs');", 0);
    ok(false, "insertRule should reject @import rules for constructed sheets");
  } catch (e) {
    is(e.name, "SyntaxError",
       "insertRule should reject constructed-sheet @import rules with SyntaxError");
  }
}

function colorFor(node) {
  return getComputedStyle(node).color;
}

function runAdoptionTests() {
  let target = document.getElementById("adopted-target");
  let adopted = new CSSStyleSheet();

  adopted.replaceSync("#adopted-target { color: rgb(12, 34, 56); }");
  document.adoptedStyleSheets = [adopted];

  is(document.adoptedStyleSheets.length, 1,
     "document.adoptedStyleSheets should expose assigned sheets");
  is(document.adoptedStyleSheets[0], adopted,
     "document.adoptedStyleSheets should expose the same CSSStyleSheet object");
  is(document.styleSheets.length, 1,
     "document.styleSheets should not include adopted sheets");
  is(colorFor(target), "rgb(12, 34, 56)",
     "adopted document sheets should apply");

  adopted.replaceSync("#adopted-target { color: rgb(20, 30, 40); }");
  is(colorFor(target), "rgb(20, 30, 40)",
     "mutating an adopted sheet should update document style");

  let laterStyle = document.createElement("style");
  laterStyle.textContent = "#adopted-target { color: rgb(1, 2, 3); }";
  document.head.appendChild(laterStyle);
  is(colorFor(target), "rgb(20, 30, 40)",
     "adopted document sheets should cascade after ordinary document sheets");

  try {
    document.adoptedStyleSheets = [document.styleSheets[0]];
    ok(false, "adopting a non-constructed sheet should throw");
  } catch (e) {
    is(e.name, "NotAllowedError",
       "adopting a non-constructed sheet should throw NotAllowedError");
  }

  let iframe = document.createElement("iframe");
  iframe.onload = function() {
    let foreignSheet = new iframe.contentWindow.CSSStyleSheet();
    try {
      document.adoptedStyleSheets = [foreignSheet];
      ok(false, "adopting a sheet from another document should throw");
    } catch (e) {
      is(e.name, "NotAllowedError",
         "adopting a sheet from another document should throw NotAllowedError");
    }
    iframe.remove();

    if ("attachShadow" in document.getElementById("shadow-host")) {
      runShadowAdoptionTests();
    } else {
      finishAdoptionTests();
    }
  };
  document.body.appendChild(iframe);
}

function runShadowAdoptionTests() {
  let host = document.getElementById("shadow-host");
  let root = host.attachShadow({ mode: "open" });
  root.innerHTML = "<style>span { color: rgb(1, 2, 3); }</style><span>shadow</span>";

  let shadowSheet = new CSSStyleSheet();
  shadowSheet.replaceSync("span { color: rgb(45, 67, 89); }");
  root.adoptedStyleSheets = [shadowSheet];

  let span = root.querySelector("span");
  is(root.adoptedStyleSheets.length, 1,
     "shadowRoot.adoptedStyleSheets should expose assigned sheets");
  is(root.styleSheets.length, 1,
     "shadowRoot.styleSheets should not include adopted sheets");
  is(colorFor(span), "rgb(45, 67, 89)",
     "adopted shadow sheets should apply after ordinary shadow sheets");

  shadowSheet.replaceSync("span { color: rgb(90, 80, 70); }");
  is(colorFor(span), "rgb(90, 80, 70)",
     "mutating an adopted shadow sheet should update shadow style");

  finishAdoptionTests();
}

function finishAdoptionTests() {
  document.adoptedStyleSheets = [];
  SimpleTest.finish();
}

runAdoptionTests();
</script>
</body>
</html>
